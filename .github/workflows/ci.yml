name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OFFLINE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests tools
      - name: Ruff format
        run: ruff format --check src tests tools
      - name: Mypy
        run: mypy src
      - name: Schemas up to date
        run: python tools/gen_schemas.py --check
      - name: Skill mirrors up to date
        run: python tools/sync_skills.py --check
      - name: Tests
        run: pytest
      - name: CLI smoke
        run: kallimachos --help

  secrets-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Simple token regex scan
        shell: bash
        run: |
          set -euo pipefail
          # Second, dependency-free check for well-known token shapes outside fixtures.
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|bot[0-9]{6,}:[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' -- . ':!tests/fixtures' ; then
            echo "possible secret found"; exit 1
          fi
          echo "no token-like strings found"
